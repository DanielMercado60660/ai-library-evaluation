[project]
name = "agents"
version = "0.1.0"
description = "AI Agents for the library system"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "google-genai>=0.3",
    "google-adk>=1.0",
    "mcp[cli]>=1.2",
    "httpx>=0.27",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents"]

[tool.uv.sources]
shared = { workspace = true }
