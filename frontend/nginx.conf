upstream agents_backend {
    server agents:8000;
}

upstream catalog_backend {
    server catalog:8000;
}

upstream circulation_backend {
    server circulation:8000;
}

upstream ill_backend {
    server ill:8000;
}

upstream registry_backend {
    server registry:8000;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — serve index.html for all non-file requests
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Agents backend (direct paths) ---
    location /chat {
        proxy_pass http://agents_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /benchmark {
        proxy_pass http://agents_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://agents_backend;
        proxy_set_header Host $host;
    }

    location /admin {
        proxy_pass http://agents_backend;
        proxy_set_header Host $host;
    }

    # --- Catalog service ---
    location /api/catalog/ {
        proxy_pass http://catalog_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # --- Circulation service ---
    location /api/circulation/ {
        proxy_pass http://circulation_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # --- ILL service ---
    location /api/ill/ {
        proxy_pass http://ill_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # --- Registry service ---
    location /api/registry/ {
        proxy_pass http://registry_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
