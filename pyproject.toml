[project]
name = "ai-library"
version = "0.1.0"
description = "An instrumented fictional library network for evaluating stateful AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["shared", "services/*", "agents"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "freezegun>=1.4",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services", "agents/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--import-mode=importlib",
    "-v",
]
markers = [
    "chaos_profile: deterministic chaos fault profile for v1.3 scenarios",
]

[tool.coverage.run]
source = ["services/catalog/src", "services/circulation/src"]
omit = ["*/tests/*", "*/__pycache__/*", "*/conftest.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.uv.sources]
shared = { workspace = true }
