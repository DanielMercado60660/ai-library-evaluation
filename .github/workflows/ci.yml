name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-benchmark:
    runs-on: ubuntu-latest
    env:
      GOOGLE_API_KEY: ""
      EVAL_SHORTCUTS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked workspace
        run: uv sync --frozen --all-packages
      - name: Service, scenario, and agent tests
        run: uv run pytest -q
      - name: Architecture checks
        run: |
          uv run python scripts/check_adr_links.py --strict
          uv run python scripts/check_dependency_boundaries.py --strict
          uv run python scripts/check_resilience_policy.py --strict
      - name: Performance smoke
        run: uv run python scripts/perf_smoke.py --strict
      - name: Generate deterministic benchmark artifacts
        run: uv run python scripts/benchmark_run.py --suite scenarios --include-adk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deterministic-benchmark
          path: artifacts/**

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend
        working-directory: frontend
        run: npm ci
      - name: Production build
        working-directory: frontend
        run: npm run build -- --configuration production
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests with mocked backend
        working-directory: frontend
        run: npm run e2e -- --grep-invert 'live backend'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: frontend/test-results/**

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install verified Gitleaks release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 --repo gitleaks/gitleaks --pattern 'gitleaks_8.30.1_linux_x64.tar.gz' --pattern 'gitleaks_8.30.1_checksums.txt' --dir /tmp/gitleaks
          cd /tmp/gitleaks
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
      - name: Scan all reachable Git history
        run: /tmp/gitleaks/gitleaks git --redact=100 --log-opts='--all' --no-banner .
