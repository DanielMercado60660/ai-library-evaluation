[project]
name = "catalog"
version = "0.1.0"
description = "Catalog service for AI Library"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "aiosqlite>=0.19",
    "greenlet>=3.0",
    "mcp[cli]>=1.2",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.uv.sources]
shared = { workspace = true }
