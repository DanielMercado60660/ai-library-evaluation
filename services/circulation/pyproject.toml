[project]
name = "circulation"
version = "0.1.0"
description = "Circulation service for Hanno Memorial Library - checkouts, returns, holds, and fines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "sqlmodel>=0.0.14",
    "aiosqlite>=0.19.0",
    "greenlet>=3.0",
    "mcp[cli]>=1.2",
    "shared",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/circulation"]

[tool.uv.sources]
shared = { workspace = true }
